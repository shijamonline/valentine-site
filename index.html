<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Thachuski 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Comic Sans MS', cursive, sans-serif;

    background: 
        linear-gradient(rgba(255, 120, 150, 0.5), rgba(255, 120, 150, 0.5)),
        url("love.jpg") no-repeat center center;

    background-size: cover;
}

    .container {
        text-align: center;
        position: relative;
        z-index: 2;
    }

    h1 {
        font-size: 2.5rem;
        color: white;
        text-shadow: 2px 2px 6px #ff4e50;
        padding: 0 20px;
    }

    .buttons {
        margin-top: 40px;
        position: relative;
        width: 350px;
        height: 220px;
        margin-left: auto;
        margin-right: auto;
    }

    button {
        padding: 12px 30px;
        font-size: 18px;
        border: none;
        border-radius: 40px;
        cursor: pointer;
        position: absolute;
        transition: all 0.25s ease;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    #yesBtn {
        background-color: #ff4e50;
        color: white;
        left: 30px;
        top: 80px;
    }

    #yesBtn:hover {
        transform: scale(1.1);
    }

    #noBtn {
        background-color: #444;
        color: white;
        right: 30px;
        top: 80px;
    }

    /* Floating hearts */
    .heart {
        position: absolute;
        font-size: 20px;
        animation: float 6s linear forwards;
    }

    @keyframes float {
        from {
            transform: translateY(100vh);
            opacity: 1;
        }
        to {
            transform: translateY(-10vh);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h1>Will you be my Valentine Thachuski? 💖</h1>

    <div class="buttons">
        <button id="yesBtn">Yes 💕</button>
        <button id="noBtn">No 😢</button>
    </div>
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const buttonArea = document.querySelector(".buttons");

    function moveNoButton() {
        const areaRect = buttonArea.getBoundingClientRect();
        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;

        const maxX = areaRect.width - btnWidth;
        const maxY = areaRect.height - btnHeight;

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";
    }

    // Desktop hover
    noBtn.addEventListener("mouseover", moveNoButton);

    // Extra safety (click attempt)
    noBtn.addEventListener("mousedown", moveNoButton);

    // Mobile touch
    noBtn.addEventListener("touchstart", function(e) {
        e.preventDefault();
        moveNoButton();
    });

    // YES button success
    yesBtn.addEventListener("click", () => {
        document.body.innerHTML = `
            <div style="
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
                flex-direction:column;
                background:linear-gradient(135deg, #ff758c, #ff7eb3);
                color:white;
                text-align:center;
            ">
                <h1 style="font-size:3rem;">Thachuski said YES!!! 💖🥰</h1>
                <p style="font-size:1.5rem;">Best Valentine Ever ❤️</p>
            </div>
        `;
        createHearts();
    });

    function createHearts() {
        setInterval(() => {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "💖";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = Math.random() * 30 + 20 + "px";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }, 300);
    }
</script>

</body>
</html>
